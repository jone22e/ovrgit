<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Ovseer</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">O</span><div><h1>Ovseer</h1><p id="status">Conectando…</p></div></header>
  <section id="pairing">
    <strong>Conexão automática</strong>
    <p id="connection-help">Mantenha o Ovseer aberto neste computador. A extensão se conecta sozinha, sem código nem configuração.</p>
    <button id="connect" type="button">Tentar novamente</button>
  </section>
  <p id="error" role="alert"></p>
  <main id="sessions"></main>
  <footer><button id="disconnect" class="secondary" hidden>Desconectar</button><span>Você escolhe as abas que cada conversa pode controlar.</span></footer>
  <script type="module" src="popup.js"></script>
</body></html>
